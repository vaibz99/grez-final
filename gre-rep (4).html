<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Rep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #242424;
    --text: #f0f0f0; --text2: #aaa; --text3: #555;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --green: #4caf50; --red: #f44336; --orange: #ff9800;
    --radius: 16px; --radius-sm: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; }
  .sync-dot.online { background: var(--green); }
  .sync-dot.syncing { background: var(--orange); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .streak { font-size: 13px; color: var(--text2); }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--bg2); padding: 4px; border-radius: var(--radius-sm); }
  .tab { flex: 1; font-size: 13px; padding: 8px; border-radius: 7px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .tab.active { background: var(--bg3); color: var(--text); }
  .due-count { text-align: center; margin-bottom: 20px; padding-top: 20px; }
  .due-count .num { font-size: 64px; font-weight: 700; line-height: 1; }
  .due-count .label { font-size: 13px; color: var(--text2); margin-top: 6px; }
  .start-btn { width: 100%; padding: 18px; font-size: 15px; font-weight: 600; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; font-family: inherit; margin-top: 12px; }
  .clear-msg { text-align: center; padding: 4rem 1rem; }
  .clear-msg .emoji { font-size: 52px; margin-bottom: 14px; }
  .clear-msg p { font-size: 14px; color: var(--text2); line-height: 1.7; }
  .progress-bar { height: 3px; background: var(--bg3); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--text2); border-radius: 2px; transition: width 0.3s; }
  .card-counter { font-size: 12px; color: var(--text3); text-align: right; margin-bottom: 10px; }
  .card { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px; margin-bottom: 14px; cursor: pointer; transition: transform 0.1s; }
  .card:active { transform: scale(0.99); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border2); color: var(--text2); }
  .card-interval { font-size: 11px; color: var(--text3); white-space: nowrap; }
  .card-question { font-size: 15px; line-height: 1.7; color: var(--text); }
  .card-tap { font-size: 12px; color: var(--text3); text-align: center; margin-top: 20px; }
  .processing-badge { font-size: 11px; color: var(--orange); margin-top: 8px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .answer-section { margin-bottom: 14px; }
  .answer-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .answer-text { font-size: 14px; line-height: 1.7; color: var(--text2); }
  .mistake-section { background: rgba(244,67,54,0.07); border: 1px solid rgba(244,67,54,0.2); border-radius: var(--radius-sm); padding: 12px 14px; }
  .mistake-label { font-size: 10px; color: #f44336; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .mistake-text { font-size: 13px; line-height: 1.6; color: #ffaaaa; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .action-btn { padding: 18px; font-size: 15px; font-weight: 600; border: none; border-radius: var(--radius); cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .action-btn:active { opacity: 0.8; }
  .btn-nope { background: rgba(244,67,54,0.15); color: #f44336; border: 1px solid rgba(244,67,54,0.3); }
  .btn-got { background: rgba(76,175,80,0.15); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); }
  .btn-hint { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: inherit; text-align: center; width: 100%; padding: 8px; margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--bg2); border-radius: var(--radius-sm); padding: 14px 12px; text-align: center; }
  .stat-val { font-size: 26px; font-weight: 600; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .upcoming { background: var(--bg2); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; }
  .upcoming-title { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
  .upcoming-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .upcoming-row:last-child { border-bottom: none; }
  .all-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; }
  .all-card-q { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
  .all-card-meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .reprocess-btn { font-size: 11px; color: var(--orange); background: none; border: 1px solid rgba(255,152,0,0.3); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-family: inherit; }
  .due-badge { font-size: 11px; padding: 1px 7px; border-radius: 5px; }
  .due-now { background: rgba(244,67,54,0.15); color: #f44336; }
  .due-soon { background: rgba(255,152,0,0.15); color: #ff9800; }
  .due-later { background: rgba(76,175,80,0.12); color: #4caf50; }
  .empty { text-align: center; padding: 3rem 1rem; font-size: 13px; color: var(--text3); line-height: 1.8; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-size: 13px; padding: 10px 18px; border-radius: var(--radius-sm); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>GRE Rep</h1>
    <div class="header-right">
      <span class="streak" id="streak-display">🔥 0</span>
      <span class="sync-dot syncing" id="sync-dot"></span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('review')">review</button>
    <button class="tab" onclick="switchTab('cards')">all cards</button>
    <button class="tab" onclick="switchTab('stats')">stats</button>
  </div>
  <div id="tab-review"></div>
  <div id="tab-cards" style="display:none"></div>
  <div id="tab-stats" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJG-J1l71PQwNMbGg6lWStAzf6a0p4xKM",
  authDomain: "grez-938e4.firebaseapp.com",
  projectId: "grez-938e4",
  storageBucket: "grez-938e4.firebasestorage.app",
  messagingSenderId: "589670459340",
  appId: "1:589670459340:web:c14d53223c8dde9e909f69",
  measurementId: "G-3K93CK35BJ"
};

const GEMINI_KEY = "AIzaSyCXUE0daFrLankOtk_dZJAN3QR_GOxkzXw";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let trackerQuestions = [];
let repCards = {};
let reviewQueue = [];
let currentCardIndex = 0;
let cardFlipped = false;
let sessionStreak = 0;
let currentTab = "review";

const today = () => new Date().toISOString().slice(0, 10);
const daysDiff = (d) => Math.floor((new Date(d) - new Date(today())) / 86400000);

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function setSyncDot(state) {
  document.getElementById("sync-dot").className = "sync-dot " + state;
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function processWithGemini(questionText, notes, section, topic) {
  const prompt = [
    "You are a GRE tutor. A student dumped raw question text and messy personal notes. Do 3 things:",
    "",
    "1. \"front\": Extract ONLY the clean GRE question. Strip all student commentary, markdown artifacts, ids, dashes, formatting noise. Just the bare question as it would appear on GRE. Max 4 sentences.",
    "",
    "2. \"answer\": Explain the correct answer clearly and concisely. For quant show the solution steps. For verbal explain the logic. 3-5 sentences. Be direct, no fluff.",
    "",
    "3. \"mistake\": Based ONLY on the student notes, identify exactly what they did wrong or misunderstood. Start with 'You'. Be specific. E.g. 'You misread tenths as units digit' or 'You changed reported to actual in your head which broke the logic'. If notes are empty write: 'No specific mistake noted — review this concept carefully.'",
    "",
    "RAW QUESTION DUMP:",
    questionText,
    "",
    "STUDENT NOTES:",
    (notes || "none provided"),
    "",
    "SECTION: " + section + " | TOPIC: " + topic,
    "",
    "Reply ONLY with JSON, no markdown, no backticks, no extra text:",
    "{\"front\": \"...\", \"answer\": \"...\", \"mistake\": \"...\"}"
  ].join("\n");

  try {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_KEY,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      }
    );
    const data = await res.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const clean = raw.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    return {
      front: parsed.front || questionText,
      back: parsed.answer || notes || "no answer",
      mistake: parsed.mistake || ""
    };
  } catch (e) {
    console.error("Gemini failed:", e);
    return { front: questionText, back: notes || "no notes", mistake: "" };
  }
}

async function syncNewCards(questions) {
  for (const q of questions) {
    const existing = repCards[q.id];
    if (existing && existing.processed) continue;
    const cardRef = doc(db, "repCards", q.id);
    if (!existing) {
      const newCard = {
        questionId: q.id,
        front: q.questionText,
        back: q.notes || "processing...",
        mistake: "",
        processed: false,
        interval: 1,
        dueDate: today(),
        section: q.section || "Quant",
        topic: q.topic || "",
        difficulty: q.difficulty || "Medium",
        reviewCount: 0,
        gotItCount: 0,
        createdAt: new Date().toISOString()
      };
      await setDoc(cardRef, newCard);
      repCards[q.id] = { id: q.id, ...newCard };
    }
    // fire Gemini
    processWithGemini(q.questionText, q.notes, q.section, q.topic).then(async (result) => {
      await updateDoc(cardRef, {
        front: result.front,
        back: result.back,
        mistake: result.mistake,
        processed: true
      });
    });
  }
}

// force reprocess a single card
window.reprocessCard = async function(qId) {
  const q = trackerQuestions.find(x => x.id === qId);
  if (!q) return;
  showToast("reprocessing with Gemini...");
  const cardRef = doc(db, "repCards", qId);
  const result = await processWithGemini(q.questionText, q.notes, q.section, q.topic);
  await updateDoc(cardRef, { front: result.front, back: result.back, mistake: result.mistake, processed: true });
  showToast("done ✓");
};

// reprocess ALL — fixes cards made by old broken version
window.reprocessAll = async function() {
  const all = Object.values(repCards);
  if (!all.length) { showToast("no cards"); return; }
  const btn = document.getElementById("reprocess-all-btn");
  if (btn) { btn.disabled = true; btn.textContent = "processing 0/" + all.length; }
  let done = 0;
  for (const card of all) {
    const q = trackerQuestions.find(x => x.id === card.id || x.id === card.questionId);
    if (!q) { done++; continue; }
    try {
      const result = await processWithGemini(q.questionText, q.notes, q.section, q.topic);
      await updateDoc(doc(db, "repCards", card.id), { front: result.front, back: result.back, mistake: result.mistake, processed: true });
      done++;
      if (btn) btn.textContent = "processing " + done + "/" + all.length;
    } catch(e) { console.error(e); }
    await new Promise(r => setTimeout(r, 400));
  }
  if (btn) { btn.disabled = false; btn.textContent = "reprocess all with AI"; }
  showToast("all " + done + " cards done ✓");
};

// LISTENERS
const qQuery = query(collection(db, "questions"), orderBy("createdAt", "desc"));
onSnapshot(qQuery, async snap => {
  trackerQuestions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  setSyncDot("online");
  await syncNewCards(trackerQuestions);
  renderCurrentTab();
}, () => setSyncDot("error"));

onSnapshot(collection(db, "repCards"), snap => {
  snap.docs.forEach(d => { repCards[d.id] = { id: d.id, ...d.data() }; });
  renderCurrentTab();
});

async function reviewCard(cardId, gotIt) {
  const card = repCards[cardId];
  if (!card) return;
  const newInterval = gotIt ? Math.min((card.interval || 1) * 2, 30) : 1;
  const due = new Date();
  due.setDate(due.getDate() + newInterval);
  const dueDate = due.toISOString().slice(0, 10);
  await updateDoc(doc(db, "repCards", cardId), {
    interval: newInterval, dueDate,
    reviewCount: (card.reviewCount || 0) + 1,
    gotItCount: (card.gotItCount || 0) + (gotIt ? 1 : 0),
    lastReviewed: today()
  });
  repCards[cardId] = { ...card, interval: newInterval, dueDate };
  if (gotIt) { sessionStreak++; } else { sessionStreak = 0; }
  document.getElementById("streak-display").textContent = "🔥 " + sessionStreak;
  currentCardIndex++;
  cardFlipped = false;
  renderCurrentTab();
}

function getDueCards() {
  return Object.values(repCards).filter(c => c.dueDate <= today());
}

function renderReview() {
  const el = document.getElementById("tab-review");
  const dueCards = getDueCards();

  if (reviewQueue.length === 0 || currentCardIndex >= reviewQueue.length) {
    if (dueCards.length === 0) {
      el.innerHTML = '<div class="clear-msg"><div class="emoji">✅</div><p>you\'re clear for today<br><span style="color:var(--text3)">come back tomorrow</span></p></div>';
    } else {
      el.innerHTML = '<div class="due-count"><div class="num">' + dueCards.length + '</div><div class="label">cards due today</div></div><button class="start-btn" onclick="startSession()">start review</button>';
    }
    return;
  }

  const cardStub = reviewQueue[currentCardIndex];
  if (!cardStub) {
    reviewQueue = []; currentCardIndex = 0;
    el.innerHTML = '<div class="clear-msg"><div class="emoji">🎯</div><p>session done!<br><span style="color:var(--text3)">' + (sessionStreak > 0 ? "streak: " + sessionStreak + " 🔥" : "keep grinding") + '</span></p></div>';
    return;
  }
  // always read LIVE from repCards so reprocessed data shows immediately
  const card = repCards[cardStub.id] || cardStub;

  const progress = Math.round((currentCardIndex / reviewQueue.length) * 100);
  const intervalText = card.interval === 1 ? "tomorrow" : "in " + card.interval + " days";

  let answerHTML = "";
  if (cardFlipped) {
    answerHTML = '<div class="divider"></div>' +
      '<div class="answer-section">' +
        '<div class="answer-label">answer / explanation</div>' +
        '<div class="answer-text">' + escHtml(card.back) + '</div>' +
      '</div>';
    if (card.mistake && card.mistake.trim()) {
      answerHTML += '<div class="mistake-section">' +
        '<div class="mistake-label">⚠ your mistake</div>' +
        '<div class="mistake-text">' + escHtml(card.mistake) + '</div>' +
      '</div>';
    }
  }

  el.innerHTML =
    '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="card-counter">' + (currentCardIndex + 1) + ' / ' + reviewQueue.length + '</div>' +
    '<div class="card" onclick="flipCard()">' +
      '<div class="card-top">' +
        '<div class="card-badges">' +
          '<span class="badge">' + escHtml(card.section) + '</span>' +
          '<span class="badge">' + escHtml(card.topic) + '</span>' +
          '<span class="badge">' + escHtml(card.difficulty || "") + '</span>' +
        '</div>' +
        '<span class="card-interval">' + intervalText + '</span>' +
      '</div>' +
      '<div class="card-question">' + escHtml(card.front) + '</div>' +
      (!card.processed ? '<div class="processing-badge">✦ gemini processing...</div>' : '') +
      answerHTML +
      (!cardFlipped ? '<div class="card-tap">tap to reveal answer</div>' : '') +
    '</div>' +
    (cardFlipped ?
      '<div class="action-btns">' +
        '<button class="action-btn btn-nope" onclick="handleReview(\'' + card.id + '\', false)">✗ nope</button>' +
        '<button class="action-btn btn-got" onclick="handleReview(\'' + card.id + '\', true)">✓ got it</button>' +
      '</div>'
      : '<button class="btn-hint" onclick="flipCard()">tap card to reveal</button>'
    );
}

function renderCards() {
  const el = document.getElementById("tab-cards");
  const all = Object.values(repCards).sort((a, b) => a.dueDate > b.dueDate ? 1 : -1);
  if (!all.length) { el.innerHTML = '<div class="empty">no cards yet<br>add questions in the tracker</div>'; return; }
  el.innerHTML = all.map(c => {
    const diff = daysDiff(c.dueDate);
    const dueCls = diff <= 0 ? "due-now" : diff <= 2 ? "due-soon" : "due-later";
    const dueLabel = diff <= 0 ? "due now" : diff === 1 ? "tomorrow" : "in " + diff + " days";
    return '<div class="all-card">' +
      '<div class="all-card-q">' + escHtml(c.front) + '</div>' +
      '<div class="all-card-meta">' +
        '<span class="badge">' + escHtml(c.section) + '</span>' +
        '<span class="badge">' + escHtml(c.topic) + '</span>' +
        '<span class="due-badge ' + dueCls + '">' + dueLabel + '</span>' +
        '<span>reviewed ' + (c.reviewCount || 0) + 'x</span>' +
        '<button class="reprocess-btn" onclick="reprocessCard(\'' + c.id + '\')">reprocess AI</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

function renderStats() {
  const el = document.getElementById("tab-stats");
  const all = Object.values(repCards);
  const total = all.length;
  const due = getDueCards().length;
  const totalReviews = all.reduce((s, c) => s + (c.reviewCount || 0), 0);
  const totalGot = all.reduce((s, c) => s + (c.gotItCount || 0), 0);
  const acc = totalReviews > 0 ? Math.round(totalGot / totalReviews * 100) : 0;
  const upcoming = [];
  for (let i = 0; i <= 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    const count = all.filter(c => c.dueDate === ds).length;
    if (count > 0) upcoming.push({ label: i === 0 ? "today" : i === 1 ? "tomorrow" : "in " + i + " days", count });
  }
  el.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-val">' + total + '</div><div class="stat-label">total cards</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + due + '</div><div class="stat-label">due today</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + acc + '%</div><div class="stat-label">accuracy</div></div>' +
    '</div>' +
    '<div class="upcoming"><div class="upcoming-title">upcoming reviews</div>' +
    (upcoming.length ? upcoming.map(u => '<div class="upcoming-row"><span>' + u.label + '</span><span style="color:var(--text2)">' + u.count + ' cards</span></div>').join("") : '<div style="font-size:13px;color:var(--text3)">nothing scheduled</div>') +
    '</div>' +
    '<div style="margin-top:14px"><button id="reprocess-all-btn" onclick="reprocessAll()" style="width:100%;padding:14px;font-size:13px;font-weight:600;background:rgba(255,152,0,0.12);color:#ff9800;border:1px solid rgba(255,152,0,0.3);border-radius:10px;cursor:pointer;font-family:inherit;">reprocess all with AI</button><div style="font-size:11px;color:var(--text3);text-align:center;margin-top:6px">fixes cards showing raw notes instead of AI explanation</div></div>';
}

function renderCurrentTab() {
  if (currentTab === "review") renderReview();
  else if (currentTab === "cards") renderCards();
  else renderStats();
}

window.switchTab = function(t) {
  currentTab = t;
  ["review","cards","stats"].forEach((x, i) => {
    document.getElementById("tab-" + x).style.display = x === t ? "block" : "none";
    document.querySelectorAll(".tab")[i].classList.toggle("active", x === t);
  });
  renderCurrentTab();
};

window.startSession = function() {
  reviewQueue = getDueCards().sort(() => Math.random() - 0.5);
  currentCardIndex = 0; cardFlipped = false; sessionStreak = 0;
  renderReview();
};

window.flipCard = function() { cardFlipped = true; renderReview(); };

window.handleReview = function(cardId, gotIt) {
  showToast(gotIt ? "got it 🔥" : "noted, back soon");
  reviewCard(cardId, gotIt);
};
</script>
</body>
</html>
